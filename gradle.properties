kotlin.code.style=official
# Auto-replace yarn.lock to avoid stale npm dependency resolution issues (e.g., caniuse-lite)
kotlin.js.yarn.lock.auto.replace=true
# GitHub runners expose installed JDKs as JAVA_HOME_<major>_X64; let Gradle's toolchain
# detection see them (CI daemon on 21, compilation on the 25 toolchain). Unset locally.
org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_21_X64
