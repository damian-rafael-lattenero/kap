name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:

  # ── Fast gate: wrapper validation ────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

  # ── Unit & comparison tests (parallel matrix) ───────────────────────────
  test:
    name: Test · ${{ matrix.module }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: kap-core
            task: ":kap-core:jvmTest"
            report-path: "kap-core/build/reports/tests/jvmTest"
          - module: kap-resilience
            task: ":kap-resilience:jvmTest"
            report-path: "kap-resilience/build/reports/tests/jvmTest"
          - module: kap-arrow
            task: ":kap-arrow:test"
            report-path: "kap-arrow/build/reports/tests/test"
          - module: kap-ksp
            task: ":kap-ksp:test"
            report-path: "kap-ksp/build/reports/tests/test"
          - module: kap-kotest
            task: ":kap-kotest:test"
            report-path: "kap-kotest/build/reports/tests/test"
          - module: kap-ktor
            task: ":kap-ktor:test"
            report-path: "kap-ktor/build/reports/tests/test"
          - module: benchmarks
            task: ":benchmarks:test"
            report-path: "benchmarks/build/reports/tests/test"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run tests
        run: ./gradlew ${{ matrix.task }}
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.module }}
          path: ${{ matrix.report-path }}
          retention-days: 14

  # ── Binary compatibility (validated modules: kap-core, kap-arrow, kap-resilience) ──
  api-compat:
    name: API Compatibility
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Check public API against committed .api dumps
        run: ./gradlew apiCheck

  # ── Claim verification (README/LAWS/docs numbers vs repo reality) ─────────
  claims:
    name: Claims
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify numeric claims
        run: ./scripts/verify-claims.sh

  # ── Static analysis (detekt; new violations fail, baselined ones tolerated) ──
  detekt:
    name: Detekt
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Run detekt (plain + type resolution)
        run: ./gradlew detektAll

  # ── Multiplatform compilation checks ─────────────────────────────────────
  compile-platforms:
    name: Compile · ${{ matrix.target }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [Js, WasmJs, LinuxX64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Compile ${{ matrix.target }}
        run: ./gradlew compileKotlin${{ matrix.target }}

  # ── Codegen freshness check ──────────────────────────────────────────────
  codegen-check:
    name: Codegen · Up-to-date
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Regenerate all codegen
        run: |
          ./gradlew :kap-core:generateAll \
                    :kap-resilience:generateResourceZip \
                    :kap-arrow:generateValidatedOverloads
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::Generated code is out of date. Run codegen tasks and commit the results."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            git diff --stat
            exit 1
          fi
          echo "Generated code is up-to-date"

  # ── Examples integration ──────────────────────────────────────────────────
  examples:
    name: Examples
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Run examples
        run: |
          for mod in \
            ecommerce-checkout \
            dashboard-aggregator \
            validated-registration \
            resilient-fetcher \
            full-stack-order \
            readme-examples \
            ksp-demo; do
            echo ""
            echo "════════════════════════════════════════"
            echo "  Running: examples/$mod"
            echo "════════════════════════════════════════"
            ./gradlew ":examples:$mod:run"
          done

      - name: Ktor integration tests
        run: ./gradlew :examples:ktor-integration:test

  # ── JMH Benchmarks — full run on push, track history ─────────────────────
  benchmark:
    name: Benchmark · Track
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run JMH benchmarks
        run: ./gradlew :benchmarks:jmh

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1.22.0
        with:
          name: KAP JMH Benchmarks
          tool: jmh
          output-file-path: benchmarks/build/results/jmh/results.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks
          auto-push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Regression gate: >20% slower than the tracked baseline fails the
          # push — "zero overhead" is an enforced invariant, not a claim.
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: "@damian-rafael-lattenero"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results
          path: benchmarks/build/results/jmh/
          retention-days: 90

  # ── JMH Benchmarks — quick run on PR, compare & comment ──────────────────
  benchmark-pr:
    name: Benchmark · PR Compare
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run JMH benchmarks (quick)
        run: ./gradlew :benchmarks:jmh -Pjmh.warmup=1 -Pjmh.iterations=2 -Pjmh.fork=1

      - name: Compare with baseline
        uses: benchmark-action/github-action-benchmark@v1.22.0
        with:
          name: KAP JMH Benchmarks
          tool: jmh
          output-file-path: benchmarks/build/results/jmh/results.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks
          auto-push: false
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: "@damian-rafael-lattenero"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PR benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results-pr
          path: benchmarks/build/results/jmh/
          retention-days: 14

  # ── Aggregate status gate (for branch protection rules) ──────────────────
  ci-gate:
    name: CI Gate
    if: always()
    needs: [test, compile-platforms, codegen-check, examples, detekt, claims, api-compat]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          echo "test:              ${{ needs.test.result }}"
          echo "compile-platforms: ${{ needs.compile-platforms.result }}"
          echo "codegen-check:     ${{ needs.codegen-check.result }}"
          echo "examples:          ${{ needs.examples.result }}"
          echo "detekt:            ${{ needs.detekt.result }}"
          echo "claims:            ${{ needs.claims.result }}"
          echo "api-compat:        ${{ needs.api-compat.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.compile-platforms.result }}" != "success" ] || \
             [ "${{ needs.codegen-check.result }}" != "success" ] || \
             [ "${{ needs.examples.result }}" != "success" ] || \
             [ "${{ needs.detekt.result }}" != "success" ] || \
             [ "${{ needs.claims.result }}" != "success" ] || \
             [ "${{ needs.api-compat.result }}" != "success" ]; then
            echo ""
            echo "One or more required jobs failed."
            exit 1
          fi
          echo ""
          echo "All CI checks passed."
